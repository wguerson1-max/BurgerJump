<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- 🔥 fullscreen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

  <title>Burger Jump</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #rotateMsg {
      position: fixed;
      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      background: black;
      color: white;

      font-size: 26px;

      z-index: 9999;

      text-align: center;
    }
  </style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="rotateMsg">
  BURGER 🍔 JUMP
  <br><br>
  Gira el celular
</div>

<script src="script.js"></script>

</body>
</html>
